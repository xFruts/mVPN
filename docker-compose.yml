services:
  app:
    build: .
    environment:
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_NAME: ${MINIO_ACCESS_KEY}
      MINIO_ACCESS_SECRET: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: vpn-configs
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
          condition: service_healthy
    restart: always
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: mvpn_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d mvpn_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready || wget -q --spider http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  minio-data:
networks:
  default:
    driver: bridge