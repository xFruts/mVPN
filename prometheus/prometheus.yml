global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'mvpn'
    app: 'mvpn'
    env: 'prod'

remote_write:
  - url: "https://${DASH_DOMAIN}/api/v1/write"
    basic_auth:
      username: "${MDASH_PUSH_USER}"
      password_file: "/tmp/push_password"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 10
      capacity: 2500

scrape_configs:
  - job_name: 'mvpn-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'
          app: 'mvpn'
