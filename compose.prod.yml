services:
  traefik:
    image: traefik:v3.6
    container_name: mvpn-traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.mvpn-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.mvpn-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.mvpn-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.mvpn-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.mvpn-security-headers.headers.referrerPolicy=no-referrer"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_NAME: ${MINIO_ACCESS_KEY}
      MINIO_ACCESS_SECRET: ${MINIO_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MINIO_BUCKET_NAME: vpn-configs
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      PROFILE_TITLE: ${PROFILE_TITLE}
      PROFILE_DESCRIPTION: ${PROFILE_DESCRIPTION}
      SUPPORT_URL: ${SUPPORT_URL}
      PROFILE_WEB_PAGE_URL: ${PROFILE_WEB_PAGE_URL}
      PROFILE_UPDATE_INTERVAL: ${PROFILE_UPDATE_INTERVAL}
      LOGGING_FILE_NAME: /app/logs/mvpn.log
    expose:
      - "8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always
    networks:
      - web_proxy
      - internal
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.mvpn-backend.rule=Host(`${API_DOMAIN}`) && !PathPrefix(`/actuator`)"
      - "traefik.http.routers.mvpn-backend.entrypoints=websecure"
      - "traefik.http.routers.mvpn-backend.tls=true"
      - "traefik.http.routers.mvpn-backend.tls.certresolver=le"
      - "traefik.http.routers.mvpn-backend.middlewares=mvpn-security-headers@docker"
      - "traefik.http.services.mvpn-backend.loadbalancer.server.port=8080"
  frontend:
    build:
      context: ./Frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_KEYCLOAK_URL=${KEYCLOAK_URL}
        - VITE_KEYCLOAK_REALM=${KEYCLOAK_REALM}
        - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
    restart: always
    depends_on:
      - backend
    networks:
      - internal
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: mvpn_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d mvpn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready || wget -q --spider http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: always
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mvpn-prom-agent
    restart: unless-stopped
    environment:
      - DASH_DOMAIN=${DASH_DOMAIN:-dash.maxow.ru}
      - MDASH_PUSH_USER=${MDASH_PUSH_USER}
      - MDASH_PUSH_PASSWORD=${MDASH_PUSH_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$MDASH_PUSH_PASSWORD" > /tmp/push_password
        sed -e "s|\$${MDASH_PUSH_USER}|$${MDASH_PUSH_USER}|g" \
            -e "s|\$${DASH_DOMAIN}|$${DASH_DOMAIN}|g" \
            /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.agent.path=/prometheus \
          --agent
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:3.3.2
    container_name: mvpn-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/app/logs:ro
    networks:
      - monitoring
    environment:
      - DASH_DOMAIN=${DASH_DOMAIN:-dash.maxow.ru}
      - MDASH_PUSH_USER=${MDASH_PUSH_USER}
      - MDASH_PUSH_PASSWORD=${MDASH_PUSH_PASSWORD}

volumes:
  postgres-data:
  minio-data:
  letsencrypt:
  prometheus_data:

networks:
  web_proxy:
    name: web_proxy
    driver: bridge
  internal:
    driver: bridge
  monitoring:
    driver: bridge
