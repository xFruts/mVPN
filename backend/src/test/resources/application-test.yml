spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: false

  h2:
    console:
      enabled: false

  kafka:
    bootstrap-servers: localhost:9092

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/test
        registration:
          keycloak:
            client-id: test-client
            client-secret: test-secret

minio:
  url: http://localhost:9000
  access:
    name: minioadmin
    secret: minioadmin
  bucket:
    name: test-bucket

app:
  keycloak:
    client-id: test-client
  kafka:
    topics:
      broadcast: test-broadcast-topic
    groups:
      broadcast: test-broadcast-group

vpn:
  config:
    profile-title: test-vpn
    profile-description: test-desc
    support-url: http://localhost
    profile-web-page-url: http://localhost
    profile-update-interval: 24

encryption:
  key: MySecureKey12345MySecureKey12345

logging:
  level:
    root: WARN
    org.springframework.test: INFO
