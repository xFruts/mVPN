spring:
  application:
    name: mVPN
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:mVPN-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted.packages: ru.maxow.mvpn.broadcast
            value.default.type: ru.maxow.mvpn.broadcast.BroadcastRequestDto
    template:
      default-topic: ${KAFKA_DEFAULT_TOPIC:mVPN-topic}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      client:
        provider:
            keycloak:
              issuer-uri: ${KEYCLOAK_URL}/realms/mID
              jwk-set-uri: ${KEYCLOAK_URL}/realms/mID/protocol/openid-connect/certs
              authorization-uri: ${KEYCLOAK_URL}/realms/mID/protocol/openid-connect/auth
              token-uri: ${KEYCLOAK_URL}/realms/mID/protocol/openid-connect/token
              user-info-uri: ${KEYCLOAK_URL}/realms/mID/protocol/openid-connect/userinfo
              user-name-attribute: preferred_username
        registration:
            keycloak:
                provider: keycloak
                client-id: ${KEYCLOAK_CLIENT_ID}
                client-secret: ${KEYCLOAK_CLIENT_SECRET}
                scope:
                  - openid
                  - profile
                  - email
                authorization-grant-type: authorization_code
                redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

bot:
  enabled: ${BOT_ENABLED:false}
  token: ${TELEGRAM_BOT_TOKEN}
  username: ${TELEGRAM_BOT_USERNAME}

minio:
  url: http://127.0.0.1:9000
  access:
    name: minioadmin
    secret: minioadmin
  bucket:
    name: user-configs

app:
  kafka:
    topics:
      broadcast: ${KAFKA_BROADCAST_TOPIC:broadcast-requests}
    groups:
      broadcast: ${KAFKA_BROADCAST_GROUP:broadcast-group}
  keycloak:
    client-id: mVPN
logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoint:
    web:
      exposure:
        include: health