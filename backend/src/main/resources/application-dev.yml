spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
encryption:
  key: DevKey12345DevKey12345DevKey1234

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

debug: true
logging:
  level:
    root: DEBUG
  org.springframework.web: DEBUG