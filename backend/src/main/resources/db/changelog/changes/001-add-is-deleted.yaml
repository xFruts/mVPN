databaseChangeLog:
  - changeSet:
      id: "002-add-is-deleted"
      author: "xFruts"
      preConditions:
        - onFail: "MARK_RAN"
          not:
            columnExists:
              tableName: "users"
              columnName: is_deleted
      changes:
        - addColumn:
            tableName: "users"
            columns:
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false