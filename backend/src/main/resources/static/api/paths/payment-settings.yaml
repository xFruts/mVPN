PaymentSettingsCollection:
  post:
    summary: Создать настройки платежа на месяц
    tags: [Payment Settings]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment-settings/CreateUpdatePaymentSettingsDto.yaml'
    responses:
      '201':
        description: Настройки успешно созданы
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-settings/PaymentSettingsResponseDto.yaml'
      '400':
        $ref: '../components/responses/error/BadRequest.yaml'

PaymentSettingsSingleById:
  put:
    summary: Обновить настройки платежа
    tags: [Payment Settings]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment-settings/CreateUpdatePaymentSettingsDto.yaml'
    responses:
      '201':
        description: Настройки успешно обновлены
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-settings/PaymentSettingsResponseDto.yaml'
      '400':
        $ref: '../components/responses/error/BadRequest.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'

PaymentSettingsSingleByMonth:
  get:
    summary: Получить настройки платежа по месяцу
    tags: [Payment Settings]
    parameters:
      - name: billingMonth
        in: path
        required: true
        description: Месяц в формате YYYY-MM
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
    responses:
      '200':
        description: Настройки найдены
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-settings/PaymentSettingsResponseDto.yaml'
      '400':
        $ref: '../components/responses/error/BadRequest.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'