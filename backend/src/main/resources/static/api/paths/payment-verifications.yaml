PaymentVerificationsStats:
  get:
    operationId: getPaymentVerificationStats
    summary: Получить сводную статистику по заявкам на верификацию платежей
    tags: [Payment Verifications]
    responses:
      '200':
        description: Статистика по заявкам на верификацию платежей
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-verifications/PaymentVerificationStatsDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'

# POST /v1/payment-verifications
PaymentVerificationsCollection:
  get:
    operationId: getPaymentVerifications
    summary: Получить список заявок на верификацию платежей
    tags: [Payment Verifications]
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      - name: sort
        in: query
        description: Сортировка (например, createdAt,desc)
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '../components/schemas/payment-verifications/VerificationStatus.yaml'
      - name: fullName
        in: query
        required: false
        description: >
          Поиск по ФИО (contains, case-insensitive) — совпадение по user.fullName
          или payerFullName заявки
        schema:
          type: string
      - name: createdFrom
        in: query
        description: Нижняя граница даты создания (ISO-8601, 2025-04-12T12:00:00Z).
          Если параметр не передан, по умолчанию используется первое число текущего месяца в UTC
          (00:00:00Z).
        schema:
          type: string
          format: date-time
      - name: createdTo
        in: query
        description: Верхняя граница даты создания (ISO-8601, 2025-04-12T12:00:00Z).
          Если параметр не передан, по умолчанию используется текущий момент времени в UTC 
          (00:00:00Z).
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: Страница заявок на верификацию
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-verifications/PageListPaymentVerificationDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'

  post:
    operationId: createPaymentVerification
    summary: Создать заявку на проверку платежа
    tags: [Payment Verifications]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment-verifications/CreateUpdatePaymentVerificationDto.yaml'
    responses:
      '201':
        description: Заявка успешно создана
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-verifications/PaymentVerificationResponseDto.yaml'
      '400':
        $ref: '../components/responses/error/BadRequest.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'

# POST /v1/payment-verifications/{id}/approve
PaymentVerificationsApprove:
  post:
    operationId: approvePaymentVerification
    summary: Одобрить платеж
    tags: [Payment Verifications]
    parameters:
      - name: id
        in: path
        required: true
        description: ID верификации
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment-verifications/PaymentVerificationRequestDto.yaml'
    responses:
      '200':
        description: Платеж успешно одобрен
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-verifications/PaymentVerificationResponseDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'

# POST /v1/payment-verifications/{id}/reject
PaymentVerificationsReject:
  post:
    operationId: rejectPaymentVerification
    summary: Отклонить платеж
    tags: [Payment Verifications]
    parameters:
      - name: id
        in: path
        required: true
        description: ID верификации
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment-verifications/PaymentVerificationRequestDto.yaml'
    responses:
      '200':
        description: Платеж отклонен
        content:
          application/json:
            schema:
              $ref: '../components/schemas/payment-verifications/PaymentVerificationResponseDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'