# Группа для пути /v1/promocodes (без ID)
PromocodesCollection:
  get:
    operationId: getPromocodes
    summary: Получить список всех промокодов
    tags: [Promocodes]
    parameters:
      - name: page
        in: query
        description: Номер страницы (0..N)
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        description: Количество элементов на странице
        schema:
          type: integer
          default: 10
      - name: sort
        in: query
        description: Сортировка (например, id,desc)
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: Фильтр по статусу промокода
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: Поиск по названию промокода
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Список промокодов
        content:
          application/json:
            schema:
              $ref: '../components/schemas/promocodes/PageListPromocodeDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
  post:
    operationId: createPromocode
    summary: Создать новый промокод
    tags: [Promocodes]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/promocodes/CreatePromocodeRequestDto.yaml'
    responses:
      '201':
        description: Промокод успешно создан
        content:
          application/json:
            schema:
              $ref: '../components/schemas/promocodes/PromocodeResponseDto.yaml'
      '400':
        $ref: '../components/responses/error/BadRequest.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'

# Группа для пути /v1/promocodes/{id}
PromocodeSingle:
  delete:
    operationId: deletePromocode
    summary: Удалить промокод
    tags: [Promocodes]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Промокод удален
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'