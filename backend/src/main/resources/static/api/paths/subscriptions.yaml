# URL: /v1/subscriptions/user/{userId}
SubscriptionsByUser:
  post:
    operationId: createSubscription
    summary: Создать подписку для пользователя
    tags: [Subscriptions]
    parameters:
      - name: userId
        in: path
        required: true
        description: ID пользователя
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/subscriptions/CreateUpdateSubscriptionDto.yaml'
    responses:
      '201':
        description: Подписка успешно создана
        content:
          application/json:
            schema:
              $ref: '../components/schemas/subscriptions/SubscriptionResponseDto.yaml'
      '400':
        $ref: '../components/responses/error/BadRequest.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'

  get:
    operationId: getSubscriptionsByUserId
    summary: Получить все подписки пользователя
    tags: [Subscriptions]
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Список подписок
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/subscriptions/SubscriptionResponseDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'

# URL: /v1/subscriptions/user/{userId}/last
LastSubscription:
  get:
    operationId: getLastSubscription
    summary: Получить последнюю подписку пользователя
    tags: [Subscriptions]
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Последняя подписка пользователя
        content:
          application/json:
            schema:
              $ref: '../components/schemas/subscriptions/SubscriptionResponseDto.yaml'
    401:
      $ref: '../components/responses/error/Unauthorized.yaml'
    403:
      $ref: '../components/responses/error/Forbidden.yaml'
    '404':
      $ref: '../components/responses/error/NotFound.yaml'

# URL: /v1/subscriptions/{id}
SubscriptionById:
  get:
    operationId: getSubscriptionById
    summary: Получить подписку по ID
    tags: [Subscriptions]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Подписка найдена
        content:
          application/json:
            schema:
              $ref: '../components/schemas/subscriptions/SubscriptionResponseDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'

  put:
    operationId: updateSubscription
    summary: Обновить подписку
    tags: [Subscriptions]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/subscriptions/CreateUpdateSubscriptionDto.yaml'
    responses:
      '200':
        description: Подписка обновлена
        content:
          application/json:
            schema:
              $ref: '../components/schemas/subscriptions/SubscriptionResponseDto.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'

  delete:
    operationId: deleteSubscription
    summary: Удалить подписку
    tags: [Subscriptions]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Подписка удалена
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'

SubscriptionsExtend:
  post:
    operationId: extendSubscriptions
    summary: Продлить подписки пользователей на 1 месяц
    tags: [Subscriptions]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/subscriptions/ExtendSubscriptionsRequestDto.yaml'
    responses:
      '200':
        description: Подписки продлены
      '400':
        $ref: '../components/responses/error/BadRequest.yaml'
      401:
        $ref: '../components/responses/error/Unauthorized.yaml'
      403:
        $ref: '../components/responses/error/Forbidden.yaml'
      '404':
        $ref: '../components/responses/error/NotFound.yaml'
