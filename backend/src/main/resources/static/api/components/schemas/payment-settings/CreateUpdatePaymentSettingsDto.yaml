type: object
required: [billingMonth, expectedAmount, bankName, requisites]
properties:
  billingMonth:
    type: string
    pattern: '^\d{4}-\d{2}$'
    example: "2023-11"
  expectedAmount:
    type: number
    format: double
    minimum: 0.01
    example: 75.00
  bankName:
    type: string
    maxLength: 100
    example: "Tinkoff"
  requisites:
    type: string
    maxLength: 15
    example: "+79991234567"