type: object
required:
  - fullName
  - role
properties:
  fullName:
    type: string
    minLength: 1
    example: "Иванов Иван"
  userTelegramId:
    type: integer
    format: int64
    description: ID пользователя в Telegram
    example: 123456789
  telegramUsername:
    type: string
    description: Telegram username (например, @xFruts или xFruts)
    example: "xFruts"
  role:
    $ref: './UserRole.yaml'
