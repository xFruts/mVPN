type: object
required:
  - usageLimit
  - validDays
properties:
  usageLimit:
    type: integer
    format: int32
    minimum: 1             # @Min(1)
    description: Сколько раз можно применить промокод
    example: 100
  validDays:
    type: integer
    format: int32
    minimum: 1             # @Min(1)
    description: Срок действия в днях
    example: 30
  tariff_id:
    type: integer
    format: int64
    description: Идентификатор тарифа, который будет применяться при использовании промокода
    example: 1