type: object
required:
  - id
  - fullName
  - role
properties:
  id:
    type: integer
    format: int64
  fullName:
    type: string
    example: "Иванов Иван"
  userTelegramId:
    type: integer
    format: int64
  telegramUsername:
    type: string
    example: "xFruts"
  role:
    $ref: './UserRole.yaml'
  subscription:
    description: Информация о подписке пользователя
    $ref: '../subscriptions/SubscriptionResponseDto.yaml'
