type: object
properties:
  id:
    type: integer
    format: int64
    example: 1
  billingMonth:
    type: string
    pattern: '^\d{4}-\d{2}$'
    example: "2023-11"
  expectedAmount:
    type: number
    format: double
    example: 75.00
  bankName:
    type: string
    example: "Tinkoff"
  requisites:
    type: string
    example: "+79991234567"
  createdBy:
    type: string
    example: "admin"
  createdAt:
    type: string
    format: date-time
    example: "2023-11-01T10:00:00Z"
