type: object
required:
  - name
  - location
  - ip
  - status
  - maxUsers
  - maxTraffic
  - login
  - sshAuthType
  - xuiLogin
  - xuiPassword
  - port
  - webBasePath
properties:
  name:
    type: string
    example: "Germany-VPN-01"
  location:
    type: string
    description: Первые две буквы локации сервера (ISO 3166-1)
    example: "DE"
  countryEmoji:
    type: string
    description: Эмодзи страны сервера (для отображения в ВПН конфиге)
    example: "🇩🇪"
  ip:
    type: string
    format: ipv4
    description: Публичный IPv4 адрес сервера
    example: "192.168.1.10"
  status:
    $ref: './ServerStatus.yaml'
  maxUsers:
    type: integer
    format: int32
    minimum: 1
    example: 100
  maxTraffic:
    type: integer
    format: int32
    description: Лимит трафика на пользователя в ГБ
    example: 500
  login:
    type: string
    description: SSH логин
    example: "root"
  password:
    type: string
    format: password
    description: SSH пароль
    example: "Pass1234"
  sshAuthType:
    $ref: './SshAuthType.yaml'
  sshPrivateKeyObjectKey:
    type: string
    description: Ключ объекта в MinIO, где хранится private key для SSH
    example: "ssh-keys/server-01/id_ed25519"
  xuiLogin:
    type: string
    description: Логин от 3x-ui панели
    example: "DSVOSVNceor"
  xuiPassword:
    type: string
    format: password
    example: "GNWERcwm;"
  xuiAuthToken:
    type: string
    description: Токен для доступа к API x-ui
    example: "VCSEPWCIOUh3oiycbwocec"
  subscriptionFormat:
    $ref: './SubscriptionFormat.yaml'
    description: Формат выдачи конфигурации по серверу (VLESS или JSON)
    default: VLESS
  port:
    type: integer
    format: int32
    minimum: 1
    maximum: 65535
    example: 2053
  webBasePath:
    type: string
    description: Путь к вашей админ панели x-ui
    example: "Kq8wcGUtqP5"