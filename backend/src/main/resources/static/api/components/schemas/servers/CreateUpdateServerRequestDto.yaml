type: object
required:
  - name
  - location
  - ip
  - status
  - maxUsers
  - maxTraffic
  - login
  - password
  - xuiLogin
  - xuiPassword
  - port
  - webBasePath
properties:
  name:
    type: string
    example: "Germany-VPN-01"
  location:
    type: string
    description: Первые две буквы локации сервера КАПСОМ
    example: "GE"
  ip:
    type: string
    format: ipv4
    description: Публичный IPv4 адрес сервера
    example: "192.168.1.10"
  status:
    $ref: './ServerStatus.yaml'
  maxUsers:
    type: integer
    format: int32
    minimum: 1
    example: 100
  maxTraffic:
    type: integer
    format: int32
    description: Лимит трафика на пользователя в ГБ
    example: 500
  login:
    type: string
    description: SSH логин
    example: "root"
  password:
    type: string
    format: password
    description: SSH пароль
    example: "Pass1234"
  xuiLogin:
    type: string
    description: Логин от 3x-ui панели
    example: "DSVOSVNceor"
  xuiPassword:
    type: string
    format: password
    example: "GNWERcwm;"
  port:
    type: integer
    format: int32
    minimum: 1
    maximum: 65535
    example: 2053
  webBasePath:
    type: string
    description: Путь к вашей админ панели x-ui
    example: "Kq8wcGUtqP5"