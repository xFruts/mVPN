type: object
required:
  - paidUntilDate
  - userId
  - payerFullName
  - paidAmount
properties:
  paidUntilDate:
    type: string
    format: date
    example: "2023-11-10"
    description: Дата дня, до которого оплачена подписка в формате YYYY-MM-DD
  userId:
    type: integer
    format: int64
    description: ID пользователя
  payerFullName:
    type: string
    maxLength: 255
    example: "Иван Иванов"
  paidAmount:
    type: number
    minimum: 0.01
    multipleOf: 0.01
    example: 1500.00
    description: Сумма оплаты.
  currency:
    type: string
    maxLength: 3
    example: "RUB"
    description: Валюта оплаты в формате ISO 4217 (например, "RUB" для российских рублей).
  userComment:
    type: string
    maxLength: 1000
    example: "Оплатил с карты Тинькофф, чек в телеграм скинул"
  adminComment:
    type: string
    maxLength: 1000
    example: "Чек получен"