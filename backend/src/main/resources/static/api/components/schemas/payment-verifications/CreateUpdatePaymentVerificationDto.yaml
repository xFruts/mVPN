type: object
required:
  - billingMonth
  - userId
  - payerFullName
  - paidAmount
properties:
  billingMonth:
    type: string
    pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    example: "2023-11"
    description: Месяц оплаты в формате YYYY-MM
  userId:
    type: integer
    format: int64
    description: ID пользователя (mID)
  payerFullName:
    type: string
    maxLength: 255
    example: "Иван Иванов"
  paidAmount:
    type: number
    format: double
    minimum: 0.01
    example: 1500.00
    description: Сумма оплаты. Внимание! В Java коде обязательно использовать BigDecimal.
  userComment:
    type: string
    maxLength: 1000
    example: "Оплатил с карты Тинькофф, чек в телеграм скинул"
  adminComment:
    type: string
    maxLength: 1000