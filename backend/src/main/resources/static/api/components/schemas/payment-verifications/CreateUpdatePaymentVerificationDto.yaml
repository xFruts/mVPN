type: object
required:
  - billingMonth
  - userId
  - payerFullName
  - paidAmount
properties:
  billingDate:
    type: string
    pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
    example: "2023-11-10"
    description: Дата оплаты в формате YYYY-MM-DD
  userId:
    type: integer
    format: int64
    description: ID пользователя
  payerFullName:
    type: string
    maxLength: 255
    example: "Иван Иванов"
  paidAmount:
    type: number
    minimum: 0.01
    multipleOf: 0.01
    example: 1500.00
    description: Сумма оплаты.
  userComment:
    type: string
    maxLength: 1000
    example: "Оплатил с карты Тинькофф, чек в телеграм скинул"
  adminComment:
    type: string
    maxLength: 1000
    example: "Чек получен"