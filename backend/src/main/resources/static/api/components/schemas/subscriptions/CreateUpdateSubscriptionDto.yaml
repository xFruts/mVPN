type: object
required:
  - status
  - tariff_id
properties:
  startDate:
    type: string
    format: date-time
    description: Дата начала (если не передана, устанавливается текущая дата UTC)
    example: "2026-01-01T00:00:00Z"
  status:
    $ref: './SubscriptionStatus.yaml'
  tariff_id:
    type: integer
    format: int64
    description: ID тарифа
    example: 1