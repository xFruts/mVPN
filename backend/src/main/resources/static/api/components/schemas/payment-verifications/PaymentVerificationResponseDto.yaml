type: object
properties:
  id:
    type: integer
    format: int64
  userId:
    type: integer
    format: int64
  billingMonth:
    type: string
    pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    example: "2023-06"
  payerFullName:
    type: string
    example: "Иван Иванов"
  paidAmount:
    type: number
    format: double
    example: 1500.00
  status:
    $ref: './VerificationStatus.yaml'
  userComment:
    type: string
    example: "Чек скинул в тг"
  adminComment:
    type: string
    example: "Чек получен"