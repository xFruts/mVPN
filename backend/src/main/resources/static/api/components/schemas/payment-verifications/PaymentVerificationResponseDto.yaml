type: object
properties:
  id:
    type: integer
    format: int64
  userId:
    type: integer
    format: int64
  paidUntilDate:
    type: string
    format: date
    example: "2023-11-10"
    description: Дата дня, до которого оплачена подписка в формате YYYY-MM-DD
  payerFullName:
    type: string
    example: "Иван Иванов"
  paidAmount:
    type: number
    format: double
    example: 1500.00
  status:
    $ref: './VerificationStatus.yaml'
  userComment:
    type: string
    example: "Чек скинул в тг"
  adminComment:
    type: string
    example: "Чек получен"
  createdAt:
    type: string
    format: date-time
    example: "2026-04-19T12:00:00Z"
