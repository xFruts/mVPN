type: object
description: Тарифный план (ответ сервера)
required:
  - id
  - name
  - maxDevices
  - trafficLimitGb
  - serverLocation
properties:
  id:
    type: integer
    format: int64
    example: 1
  name:
    type: string
    example: "Premium 500GB"
  maxDevices:
    type: integer
    format: int32
    example: 10
  trafficLimitGb:
    type: integer
    format: int32
    description: Лимит трафика (ГБ)
    example: 500
  durationOfDays:
    type: integer
    format: int32
    description: Длительность тарифа (дни)
    example: 30
  serverLocation:
    type: array
    description: Список доступных локаций на этом тарифе
    items:
      $ref: './ServerLocation.yaml'