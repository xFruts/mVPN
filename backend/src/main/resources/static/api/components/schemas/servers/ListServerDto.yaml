type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
    example: "Finland"
  location:
    type: string
    description: Первые две буквы локации сервера КАПСОМ
    example: "FI"
  countryEmoji:
    type: string
    description: Эмодзи страны сервера
    example: "🇫🇮"
  ip:
    type: string
    format: ipv4
  status:
    $ref: './ServerStatus.yaml'
  load:
    type: integer
    description: Загрузка CPU/RAM в процентах
    example: 45
  usage:
    type: integer
    description: Текущее количество активных юзеров
    example: 4
  maxUsers:
    type: integer
    example: 100
  maxTraffic:
    type: integer
    description: Максимальный трафик на пользователя в гигабайтах
    example: 300
  ping:
    type: string
    example: "25ms"
  uptime:
    type: number
    format: double
    description: Время аптайма в процентах
    example: 80.00
  sshAuthType:
    $ref: './SshAuthType.yaml'
  sshPrivateKeyObjectKey:
    type: string
    description: Ключ объекта в MinIO с private key, если используется SSH key auth
    example: "ssh-keys/server-01/id_ed25519"
