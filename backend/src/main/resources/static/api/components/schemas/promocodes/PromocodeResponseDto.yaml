type: object
description: Данные промокода
required:
  - id
  - code
  - usage
  - usageLimit
  - status
  - expirationDate
properties:
  id:
    type: integer
    format: int64
    description: Уникальный идентификатор промокода
    example: 105
  code:
    type: string
    description: Уникальный буквенно-цифровой код
    example: "SUMMER-SALE-2024"
  usage:
    type: integer
    format: int32
    description: Текущее количество применений (сколько раз уже использовали)
    example: 42
  usageLimit:
    type: integer
    format: int32
    description: Максимально допустимое количество применений
    example: 100
  status:
    # Ссылка на Enum в этой же папке (поэтому ./)
    $ref: './PromocodeStatus.yaml'
  expirationDate:
    type: string
    format: date-time
    description: "Дата и время истечения срока действия (ISO-8601)"
    example: "2024-12-31T23:59:59"