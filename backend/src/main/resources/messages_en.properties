# Подключение и руководства
bot.connection.guide=🔗 Connect to mVPN\n\nYour personal subscription link:\n`{0}`\n\n💡 Using your subscription link is recommended:\nIt combines all your servers and updates them automatically without manual setup.\n\nChoose a guide to set up your client:
bot.guide.happ=📱 Step-by-step guide for Happ (iOS / Android / Mac / Windows)\n\nHapp is a fast and convenient client supporting VLESS Reality.\n\n1️⃣ Copy your subscription link:\n`{0}`\n\n2️⃣ Install Happ app:\n• iOS: search "Happ Proxy Utility" in App Store\n• Android: install from Google Play or GitHub\n\n3️⃣ Open Happ and go to "Configurations" tab ("➕" icon at the top).\n\n4️⃣ Tap "Add Subscription" and paste your copied link.\n\n5️⃣ Tap the 🔄 (Update) icon next to mVPN to fetch the server list.\n\n6️⃣ Select your desired country and tap the central connect button.\n\n🎉 Done! Connection established.
bot.guide.v2raytun=📱 Step-by-step guide for v2rayTun (Android / iOS)\n\nv2rayTun is a reliable client for VLESS Reality protocol.\n\n1️⃣ Copy subscription link:\n`{0}`\n\n2️⃣ Open v2rayTun and tap \"➕\" in the top right corner.\n\n3️⃣ Select \"Add Subscription URL\":\n• Remarks: mVPN\n• Subscription URL: paste copied link\nTap checkmark / save button.\n\n4️⃣ In the menu (three dots at top), select \"Update subscription\".\n\n5️⃣ Tap the desired server from list and start connection with bottom button.\n\n🎉 Done! Connection established.
bot.vless.key=🔑 Your personal VLESS key:\n\n{0}\n\n💡 How to use:\n1. Copy the key above.\n2. Open your client (Happ, v2rayTun, v2rayNG, Streisand, Hiddify).\n3. Tap \"➕\" ➔ \"Import from clipboard\".\n4. Select the added server and tap \"Connect\".
bot.vless.unavailable=⚠️ Failed to generate direct VLESS key (servers temporarily under maintenance).\n\nPlease use your subscription link:\n{0}\n\nIt will automatically load available nodes once servers are back online.

# Справка
bot.help.authenticated=ℹ️ Available mVPN bot commands:\n\n📊 /status — Tariff info, expiration date, and GB balance\n📱 /devices — List of connected devices and active IPs\n🌐 /servers — List of available countries and node statuses\n🔗 /connect — Subscription link and client setup guides\n📱 /happ — Step-by-step setup guide for Happ\n📱 /v2raytun — Step-by-step setup guide for v2rayTun\n❓ /help — Show this help message\n\nYou can also use the menu keyboard buttons.
bot.help.unauthenticated=ℹ️ Bot help:\n\nTo start, link your Telegram to your mVPN account:\n`/auth <your_token>`\n\nOnce linked, you will have access to:\n• Tariff and GB balance overview\n• Connected devices overview\n• Server status checking\n• Connection links\n• Step-by-step Happ & v2rayTun guides

