name: AI Code Review (Gemini)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: general
            name: "Gemini Senior Code Review"
            marker: "<!-- gemini-senior-review -->"
            mode: "general"
          - id: adversarial
            name: "Gemini Adversarial & Red Team Review"
            marker: "<!-- gemini-adversarial-review -->"
            mode: "adversarial"
          - id: architecture
            name: "Gemini Architecture & Clean Code Review"
            marker: "<!-- gemini-clean-architecture-review -->"
            mode: "architecture"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || 'master' }}
          fetch-depth: 0

      - name: Fetch PR commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            git fetch origin "pull/$PR_NUMBER/head:pr-head" || \
              ( [ -n "$HEAD_SHA" ] && git fetch origin "$HEAD_SHA:pr-head" )
          elif [ -n "$HEAD_SHA" ]; then
            git fetch origin "$HEAD_SHA:pr-head"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for GEMINI_API_KEY
        id: check-key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "missing_key=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY is not set in repository secrets."
          else
            echo "missing_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Missing API Key
        if: steps.check-key.outputs.missing_key == 'true' && matrix.id == 'general'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
            '⚠️ **AI Code Review пропущено**: Секрет `GEMINI_API_KEY` не найден в репозитории.' \
            || true
          exit 0

      - name: Skip secondary jobs when API key is missing
        if: steps.check-key.outputs.missing_key == 'true' && matrix.id != 'general'
        run: exit 0

      - name: Generate AI Code Review
        if: steps.check-key.outputs.missing_key == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVIEW_MODE: ${{ matrix.mode }}
          REVIEW_MARKER: ${{ matrix.marker }}
          REVIEW_NAME: ${{ matrix.name }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os
          import sys
          import json
          import subprocess
          import urllib.request
          import urllib.error

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          preferred_model = (
              os.environ.get("GEMINI_MODEL", "gemini-2.5-flash")
              .strip()
              .removeprefix("models/")
          )
          base_ref = (os.environ.get("BASE_REF") or "master").strip()
          base_sha = os.environ.get("BASE_SHA", "").strip()
          pr_number = os.environ.get("PR_NUMBER", "")
          pr_title = os.environ.get("PR_TITLE", "")
          pr_author = os.environ.get("PR_AUTHOR", "")
          pr_sha = os.environ.get("PR_SHA", "")
          repo = os.environ.get("REPO", "")
          review_mode = os.environ.get("REVIEW_MODE", "general").strip()
          review_marker = os.environ.get(
              "REVIEW_MARKER", "<!-- gemini-review -->"
          ).strip()
          review_name = os.environ.get(
              "REVIEW_NAME", "Gemini Code Review"
          ).strip()

          # Ensure base branch / ref is available locally for computing merge-base
          fetch_targets = []
          if base_ref:
              fetch_targets.extend([f"{base_ref}:{base_ref}", base_ref])
          for target in fetch_targets:
              try:
                  subprocess.run(
                      ["git", "fetch", "origin", target],
                      capture_output=True,
                      text=True,
                      check=False
                  )
              except Exception:
                  pass

          # Exclude sensitive files (strictly adhering to AGENTS.md), binary files, lockfiles
          exclude_patterns = [
              ":(exclude)*.lock",
              ":(exclude)package-lock.json",
              ":(exclude)*.jks",
              ":(exclude)*.keystore",
              ":(exclude)*.p12",
              ":(exclude)*.pem",
              ":(exclude)*.crt",
              ":(exclude)*.key",
              ":(exclude)cookies.txt",
              ":(exclude)local.properties*",
              ":(exclude).env*",
              ":(exclude)*.png",
              ":(exclude)*.jpg",
              ":(exclude)*.jpeg",
              ":(exclude)*.webp",
              ":(exclude)*.gif",
              ":(exclude)*.ico",
              ":(exclude)*.svg",
              ":(exclude)*.jar",
              ":(exclude)*.war",
              ":(exclude)*.mp3",
              ":(exclude)*.wav",
              ":(exclude)*.ogg",
              ":(exclude)*.flac",
              ":(exclude)*.mp4",
              ":(exclude).idea/**",
              ":(exclude).agents/**",
              ":(exclude).gemini/**",
              ":(exclude)target/**",
              ":(exclude)build/**",
              ":(exclude)node_modules/**",
              ":(exclude)dist/**",
          ]

          # Determine the common ancestor (merge-base)
          pr_target = "pr-head" if pr_sha else "HEAD"

          def resolve_merge_base():
              candidates = []
              if base_ref:
                  candidates.extend([f"origin/{base_ref}", base_ref])
              if base_sha:
                  candidates.append(base_sha)
              candidates.append("HEAD")

              for target in candidates:
                  mb_proc = subprocess.run(
                      ["git", "merge-base", target, pr_target],
                      capture_output=True,
                      text=True,
                      check=False
                  )
                  if mb_proc.returncode == 0 and mb_proc.stdout.strip():
                      mb = mb_proc.stdout.strip()
                      print(f"Computed merge-base between {target} and {pr_target}: {mb}")
                      return mb
              return None

          merge_base = resolve_merge_base()
          if merge_base:
              diff_targets = [f"{merge_base}..{pr_target}", f"{pr_target}~1"]
          else:
              print(f"Warning: merge-base fallback to {pr_target}~1")
              diff_targets = [f"{pr_target}~1"]

          diff_text = ""
          for diff_target in diff_targets:
              cmd = ["git", "diff", diff_target, "--", "."] + exclude_patterns
              diff_proc = subprocess.run(
                  cmd, capture_output=True, text=True, check=False
              )
              if diff_proc.returncode == 0:
                  diff_text = diff_proc.stdout
                  break

          if not diff_text or not diff_text.strip():
              print("No reviewable code changes detected.")
              with open("review_comment.md", "w", encoding="utf-8") as f:
                  f.write(
                      f"ℹ️ **{review_name}**: В этом PR нет проверяемых изменений кода."
                  )
              sys.exit(0)

          # Truncate if diff is exceptionally large (~120k chars)
          MAX_DIFF_LEN = 120000
          diff_truncated = False
          if len(diff_text) > MAX_DIFF_LEN:
              diff_text = diff_text[:MAX_DIFF_LEN]
              diff_truncated = True

          # Read AGENTS.md standards
          agents_rules = ""
          if os.path.exists("AGENTS.md"):
              try:
                  with open("AGENTS.md", "r", encoding="utf-8") as f:
                      agents_rules = f.read()
              except Exception as e:
                  print(f"Warning: could not read AGENTS.md: {e}")

          # Tailor system prompt based on the review mode
          if review_mode == "adversarial":
              system_prompt = (
                  "Ты — Principal Security Engineer & Highload Red Team Auditor в FAANG.\n"
                  "Твоя роль — жесткий адверсиальный аудит (Red Teaming) PR diff в mVPN.\n"
                  "Твоя задача — найти скрытые векторы атак, race conditions, утечки ресурсов\n"
                  "и точки деградации под нагрузкой.\n\n"
                  f"СТАНДАРТЫ И КОНТЕКСТ ПРОЕКТА (из AGENTS.md):\n{agents_rules}\n\n"
                  "СПЕЦИФИКАЦИЯ АДВЕРСИАЛЬНОГО АУДИТА:\n"
                  "1. Пиши на русском языке, предельно конкретно, жестко, по существу.\n"
                  "2. Проверь код по ключевым векторам сбоев и атак:\n"
                  "   - Concurrency & Race Conditions: Check-Then-Act паттерны в кэшах/Map\n"
                  "     (требуется атомарный CAS / replace / computeIfAbsent), гонки учета трафика,\n"
                  "     параллельные обновления подписок и узлов 3X-UI.\n"
                  "   - Java 21 Virtual Threads (Loom) Carrier Pinning: Блокировки `synchronized`\n"
                  "     при блокирующем I/O (сеть, сокеты, вызовы 3X-UI, SSH, `Thread.sleep`)\n"
                  "     блокируют carrier-потоки ForkJoinPool! Обязателен `ReentrantLock`.\n"
                  "   - HikariCP & DB Starvation: Сетевые вызовы (3X-UI REST API, SSH к VPN-узлам,\n"
                  "     MinIO S3 upload, GeoIP lookups) внутри `@Transactional` удерживают соединения БД.\n"
                  "   - Security & SSRF: Валидация URL — строгая проверка схем (http/https),\n"
                  "     хостов, портов, защита от обращений к приватным подсетям;\n"
                  "     валидация входных данных Telegram-бота (инъекции, обход экранирования);\n"
                  "     AES-256-GCM шифрование паролей/SSH-ключей; валидация JWT/OIDC токенов.\n"
                  "   - Утечки ресурсов: утечки SSH-сессий/каналов JSch; неутилизированные пулы;\n"
                  "     утечки соединений HTTP/WebClient; утечки файловых дескрипторов.\n"
                  "   - DoS & Resilience: Отсутствие таймаутов на сетевые вызовы 3X-UI и SSH,\n"
                  "     circuit breaker, retry storms, лавинообразный сброс кэша.\n"
                  "3. Формат ответа:\n"
                  "   - 🥊 **Вердикт Red Team аудита**: (PASSED 🟢 / CONCERNS 🟡 / BREACH 🔴)\n"
                  "   - 🚨 **Критические векторы атак и Highload уязвимости (Blockers)**\n"
                  "   - ⚡ **Конкурентность, Carrier Pinning и утечки ресурсов**\n"
                  "   - 🛡️ **Рекомендации по харденингу (Hardening)**\n"
                  "4. Указывай точные строки `файл:строка` и сценарий сбоя (Proof of Failure).\n"
              )
          elif review_mode == "architecture":
              # Deterministic check for lines exceeding 100 characters in the diff
              long_lines_info = []
              cur_file = ""
              ignored_exts = (".lock", ".json", ".svg", ".map", ".min.js", ".min.css")
              for line in diff_text.splitlines():
                  if line.startswith("+++ b/"):
                      cur_file = line[6:]
                  elif line.startswith("+") and not line.startswith("+++"):
                      if any(cur_file.endswith(ext) for ext in ignored_exts):
                          continue
                      added_content = line[1:]
                      if len(added_content) > 100:
                          snippet = added_content[:50]
                          long_lines_info.append(
                              f"- `{cur_file}` ({len(added_content)} симв.): `{snippet}...`"
                          )
                          if len(long_lines_info) >= 50:
                              break

              long_lines_report = (
                  "\n".join(long_lines_info[:15])
                  if long_lines_info
                  else "Строк длинее 100 символов не обнаружено."
              )

              system_prompt = (
                  "Ты — Staff Software Architect & Clean Code Guardian в FAANG.\n"
                  "Твоя роль — архитектурное ревью, чистота кода и оформление в mVPN.\n\n"
                  f"СТАНДАРТЫ И КОНТЕКСТ ПРОЕКТА (из AGENTS.md):\n{agents_rules}\n\n"
                  "СПЕЦИФИКАЦИЯ АРХИТЕКТУРНОГО РЕВЬЮ:\n"
                  "1. Пиши на русском языке, структурированно, емко, без воды.\n"
                  "2. Проверь код по стандартам:\n"
                  "   - Лимит длины строки (Line Length <= 100): жесткий стандарт AGENTS.md.\n"
                  "     Никаких исключений! Укажи каждую строку длиннее 100 символов.\n"
                  "   - DDD & Clean Architecture: изоляция домена от фреймворков; запрет утечки\n"
                  "     Entity в REST контроллеры (строго DTO + MapStruct); SRP; Ports & Adapters.\n"
                  "   - Роберт Мартин (Clean Code):\n"
                  "     * Защита от God Object / God Service (ориентир <= 250-350 строк).\n"
                  "     * Step-Down Rule: публичные методы вверху, приватные строго ниже.\n"
                  "     * Нейминг: самодокументируемый, запрет бессмысленных сокращений.\n"
                  "     * Комментарии: никакого Javadoc-мусора. Разрешены краткие комментарии\n"
                  "       НА РУССКОМ ЯЗЫКЕ только в нетривиальных местах (почему, а не что).\n"
                  "     * DRY / KISS / YAGNI: отсутствие дублирования и избыточных абстракций.\n"
                  "     * Строгий запрет @SuppressWarnings.\n"
                  "     * Полное отсутствие мертвого кода, неиспользуемых переменных и методов.\n"
                  "     * Запрет хардкода строк (i18n через messages.properties) и магических чисел.\n"
                  "   - Frontend (React 19 & Zustand):\n"
                  "     * Точечные селекторы Zustand: `const x = useStore(s => s.x)` строго\n"
                  "       обязательно. Деструктуризация `const { x } = useStore()` запрещена.\n"
                  "     * Неизменяемость состояния (immutable updates).\n"
                  "     * Декомпозиция: разделение dumb/UI и smart, без божественных классов.\n"
                  "3. Формат ответа:\n"
                  "   - 📐 **Архитектурный вердикт**: (CLEAN 🟢 / REFACTOR 🟡 / SMELL 🔴)\n"
                  "   - 📏 **Соблюдение лимита длины строки (<= 100 символов)**\n"
                  "   - 🏛️ **DDD, Clean Architecture и SRP**\n"
                  "   - ⚛️ **Качество React & Zustand кода**\n"
                  "   - 🧼 **Чистота методов, Step-Down Rule и нейминг**\n"
                  f"4. Статический анализ строк длинее 100 символов в diff:\n{long_lines_report}\n"
              )
          else:
              # General Senior Fullstack Code Review
              system_prompt = (
                  "Ты — Senior / Staff Software Engineer & Tech Lead в FAANG.\n"
                  "Твоя цель — всестороннее функциональное и инженерное код-ревью в mVPN.\n\n"
                  f"СТАНДАРТЫ И КОНТЕКСТ ПРОЕКТА (из AGENTS.md):\n{agents_rules}\n\n"
                  "СПЕЦИФИКАЦИЯ ОБЩЕГО РЕВЬЮ:\n"
                  "1. Пиши на русском языке, профессионально, уважительно, по делу.\n"
                  "2. Фокусируйся на функциональности, бизнес-логике и качестве реализации:\n"
                  "   - Бизнес-логика VPN: управление подписками, синхронизация с 3X-UI, трафик,\n"
                  "     Telegram-бот (i18n, инлайн-кнопки, оповещения, парсинг User-Agent/устройств).\n"
                  "   - UX & Resilience: 4 состояния экранов (Loading, Success, Empty, Error),\n"
                  "     отсутствие регрессий, обработка сбоев внешних VPN-панелей.\n"
                  "   - Корректная обработка граничных условий (edge cases) и сбоев сети.\n"
                  "   - Безопасность: строжайший запрет утечек секретов/токенов/.env.\n"
                  "3. Формат ответа:\n"
                  "   - 📋 **Краткое резюме изменений** (1-2 емких предложения о сути PR)\n"
                  "   - 🔍 **Функциональный анализ и бизнес-логика**\n"
                  "   - 💡 **Рекомендации по улучшению UX и API**\n"
                  "   - 👍 **Что сделано отлично** (позитивные инженерные решения)\n"
                  "   - 🏁 **Вердикт**: (LGTM ✨ или список блокирующих вопросов)\n"
                  "4. Приводи строки `файл:строка` с объяснением «ПОЧЕМУ» (Socratic Mentoring).\n"
              )

          user_prompt = f"""Pull Request: #{pr_number} - "{pr_title}"
          Автор: @{pr_author}
          Commit: {pr_sha}
          Режим ревью: {review_name}

          {"[Внимание: Diff был усечен из-за большого объема]" if diff_truncated else ""}

          Diff изменений:
          ```diff
          {diff_text}
          ```
          """

          # Dynamically discover active models supported by this API key
          def discover_models():
              list_url = (
                  f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}"
              )
              try:
                  req = urllib.request.Request(list_url, method="GET")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      available = []
                      for item in data.get("models", []):
                          methods = item.get("supportedGenerationMethods", [])
                          if "generateContent" in methods:
                              name = item.get("name", "").removeprefix("models/")
                              if name:
                                  available.append(name)
                      print(f"Available models for this key: {available}")
                      return available
              except Exception as e:
                  print(f"Warning: could not discover models dynamically ({e})")
                  return []

          available_models = discover_models()

          # Build prioritized candidate list
          candidate_models = []
          if preferred_model:
              candidate_models.append(preferred_model)

          priority_patterns = [
              "2.5-flash", "1.5-flash", "2.5-pro", "1.5-pro", "flash", "pro"
          ]
          for pat in priority_patterns:
              for m in available_models:
                  if pat in m and m not in candidate_models:
                      candidate_models.append(m)

          default_fallbacks = [
              "gemini-2.5-flash", "gemini-1.5-flash",
              "gemini-2.5-pro", "gemini-1.5-pro"
          ]
          for fb in default_fallbacks:
              if fb not in candidate_models:
                  candidate_models.append(fb)

          deprecated_models = {"gemini-2.0-flash", "gemini-1.0-pro"}
          candidate_models = [
              m for m in candidate_models if m not in deprecated_models
          ]

          print(f"[{review_name}] Models candidate queue: {candidate_models}")

          def call_gemini(model_name):
              endpoint = f"models/{model_name}:generateContent?key={api_key}"
              url = f"https://generativelanguage.googleapis.com/v1beta/{endpoint}"
              headers = {"Content-Type": "application/json"}
              payload = {
                  "systemInstruction": {
                      "parts": [{"text": system_prompt}]
                  },
                  "contents": [
                      {
                          "role": "user",
                          "parts": [{"text": user_prompt}]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.2,
                      "maxOutputTokens": 8192
                  }
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          review_body = None
          used_model = None
          errors = []

          for m in candidate_models:
              try:
                  print(f"[{review_name}] Requesting review from Gemini model: {m}...")
                  res = call_gemini(m)
                  candidates = res.get("candidates", [])
                  if candidates:
                      finish_reason = candidates[0].get("finishReason", "")
                      content_obj = candidates[0].get("content") or {}
                      parts = content_obj.get("parts") or []
                      text_parts = [
                          p.get("text", "")
                          for p in parts
                          if isinstance(p, dict) and "text" in p
                      ]
                      text = "".join(text_parts).strip()

                      if finish_reason and finish_reason not in ("STOP", "MAX_TOKENS"):
                          print(f"Warning: model {m} finished with reason: {finish_reason}")

                      if finish_reason == "MAX_TOKENS":
                          print(f"Warning: Response was truncated due to MAX_TOKENS for model {m}.")
                          text += "\n\n*(⚠️ Примечание: ревью было сокращено из-за лимита токенов)*"

                      if text:
                          review_body = text
                          used_model = m
                          print(f"[{review_name}] Received review from {m} ({finish_reason})!")
                          break
              except urllib.error.HTTPError as err:
                  err_msg = err.read().decode("utf-8")
                  print(f"Error calling {m}: HTTP {err.code} - {err_msg}")
                  errors.append(f"{m} (HTTP {err.code}): {err_msg}")
                  if err.code in (404, 400, 429) and m != candidate_models[-1]:
                      continue
              except Exception as e:
                  print(f"Error calling {m}: {e}")
                  errors.append(f"{m}: {e}")
                  if m != candidate_models[-1]:
                      continue

          if not review_body:
              combined_error = " | ".join(errors) if errors else "Unknown error"
              print(f"Failed to get review from Gemini: {combined_error}")
              with open("review_comment.md", "w", encoding="utf-8") as f:
                  f.write(
                      f"⚠️ **{review_name} error**: Не удалось получить ответ ({combined_error})."
                  )
              sys.exit(1)

          footer = (
              f"\n\n---\n{review_marker}\n"
              f"*🤖 Автоматическое ревью [{review_name}] сгенерировано "
              f"**Google Gemini ({used_model})** по стандартам [AGENTS.md](AGENTS.md) "
              f"для коммита `{pr_sha[:7]}`.*"
          )
          full_comment = review_body.strip() + footer

          with open("review_comment.md", "w", encoding="utf-8") as f:
              f.write(full_comment)

          print(f"[{review_name}] Review comment successfully created using model {used_model}.")
          EOF

      - name: Post or Update PR Comment
        if: always() && steps.check-key.outputs.missing_key == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEW_MARKER: ${{ matrix.marker }}
        run: |
          if [ ! -f review_comment.md ]; then
            echo "review_comment.md not found, skipping."
            exit 0
          fi

          # Search for existing comment matching the specific review marker
          EXISTING_COMMENT_ID=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${REVIEW_MARKER}\")) | .id" 2>/dev/null \
            | head -n 1 || true)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing comment (ID: $EXISTING_COMMENT_ID)..."
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
              -F body=@review_comment.md \
              || gh pr comment "$PR_NUMBER" --body-file review_comment.md
          else
            echo "Creating new comment for ${REVIEW_MARKER} on PR #${PR_NUMBER}..."
            gh pr comment "$PR_NUMBER" --body-file review_comment.md
          fi
